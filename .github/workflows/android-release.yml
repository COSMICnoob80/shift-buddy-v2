name: Android APK Release

# Builds an installable Android APK in the cloud and attaches it to a GitHub Release.
# Why: the APK is ~112 MB (over GitHub's 100 MB file limit for normal repos), so it
# cannot live in git. Releases allow 2 GB per file and give a stable download URL.
#
# Release builds are signed with the template debug keystore
# (mobile/android/app/build.gradle -> buildTypes.release.signingConfig = debug),
# so no signing secrets are required for distribution/testing builds.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish as a Release (e.g. v0.5.0-alpha.1). If empty, only the APK artifact is uploaded.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-36, build-tools;36.0.0, ndk;27.1.12297006'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Quality gate — typecheck
        run: npx tsc --noEmit

      - name: Quality gate — unit tests
        run: npx jest --no-color

      - name: Ensure native Android project exists
        run: |
          if [ ! -f android/gradlew ]; then
            echo "android/ missing — generating via expo prebuild"
            npx expo prebuild --platform android --no-install
          else
            echo "android/ present — using committed native project"
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shift-buddy-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Shift Buddy ${{ inputs.release_tag || github.ref_name }}
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          body: |
            ## Shift Buddy ${{ inputs.release_tag || github.ref_name }}

            **Install:** enable *"Install from unknown sources"* on your Android device, then open the APK.

            **What's in this build:** see [`SHIFT-BUDDY-SPINE.md`](https://github.com/${{ github.repository }}/blob/main/SHIFT-BUDDY-SPINE.md) for the verified feature state and known issues.

            > This build is debug-signed (`android/app/build.gradle` → `buildTypes.release.signingConfig = debug`).
            > Suitable for testing and pilot distribution. A production keystore is required before Play Store submission.
